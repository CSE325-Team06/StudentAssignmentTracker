name: Auto Promote develop → main

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request (if needed)
        env:
          GH_TOKEN: ${{ secrets.AUTO_PR_PAT }}
        run: |
          existing_pr=$(gh pr list --base main --head develop --json number --jq '.[0].number')

          if [ -z "$existing_pr" ]; then
            echo "Creating new PR from develop → main"
            gh pr create \
              --base main \
              --head develop \
              --title "🚀 Auto-promote: develop → main" \
              --body "This Pull Request was automatically created because new changes were pushed to develop.

          Auto-merge will be enabled."
          else
            echo "PR already exists: #$existing_pr"
          fi

      - name: Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.AUTO_PR_PAT }}
        run: |
          pr_number=$(gh pr list --base main --head develop --json number --jq '.[0].number')

          if [ -n "$pr_number" ]; then
            echo "Enabling auto-merge on PR #$pr_number"
            gh pr merge "$pr_number" --auto --merge
          else
            echo "No PR found to enable auto-merge"
          fi
